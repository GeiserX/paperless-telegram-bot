site_name: paperless-telegram-bot
site_url: https://geiserx.github.io/paperless-telegram-bot/
site_description: Your Paperless-ngx archive, run from Telegram.
repo_url: https://github.com/GeiserX/paperless-telegram-bot
repo_name: GeiserX/paperless-telegram-bot
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  # Dark first: the first palette entry is the default.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it:
#   nav.omitted_files   a Markdown file under docs/ that is in no nav entry and
#                       not in exclude_docs (a page nobody can reach, published
#                       at a public URL anyway);
#   nav.not_found       a nav entry whose file does not exist;
#   links.not_found     a relative link to a page or file that does not exist;
#   links.anchors       a link to a heading that does not exist;
#   links.absolute_links  a link written as /path/ (breaks under the
#                       /paperless-telegram-bot/ prefix of the site);
#   links.unrecognized_links  a relative link that leaves docs/ (../README.md).
#                       Repo files are linked by absolute GitHub URL instead.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # No page has been renamed since the site began, so there is nothing to
  # redirect. When one is, add `mkdocs-redirects==1.2.2` to
  # docs/requirements-docs.txt and uncomment:
  # - redirects:
  #     redirect_maps:
  #       old-name.md: new-name.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path includes the repository root, so a page can include a file that
  # ships (.env.example) word for word with `--8<-- ".env.example"`. A copied
  # example drifts from the real file; an included one cannot. check_paths
  # makes a missing include fail the build instead of rendering an empty block.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Renders :material-xxx: shortcodes as icons. The grid cards on index.md use
  # them; without this they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/paperless-telegram-bot
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/paperless-telegram-bot

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every Markdown file in
# docs/ whether or not it is in the nav, so anything that is not a page must be
# listed here. A name with a capital letter (ROADMAP.md) is a repo-facing note,
# read on GitHub and never published; design/, research/ and notes/ hold the
# same kind of material.
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  requirements-docs.txt

# Four tabs, each a section. The nav title equals the page's H1 (index.md is
# the one exception: H1 is the product name, nav title is Home).
nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Usage: usage.md
  - Reference:
      - Configuration: configuration.md
      - How it works: how-it-works.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Development: development.md
      - Related projects: related.md
